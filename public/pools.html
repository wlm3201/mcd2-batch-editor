<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link id="favicon" rel="icon" href="data:," />
    <title>词条总览 · MCD2</title>
    <style>
      :root {
  color-scheme: dark;
  --bg: #12191b;
  --panel: #192224;
  --line: #344342;
  --hair: #2a3837;
  --ink: #edf4ef;
  --dim: #b3c1ba;
  --quiet: #99ada4;
  --mint: #a6e4bc;
  --mono: ui-monospace, Consolas, monospace;
  background: var(--bg);
  color: var(--ink);
  font:
    14px/1.5 'Segoe UI',
    'Microsoft YaHei UI',
    system-ui,
    sans-serif;
}
* {
  box-sizing: border-box;
}
body,
h1,
h2,
h3,
p {
  margin: 0;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  background: none;
  border: 0;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--mint);
  outline-offset: 2px;
}
[hidden] {
  display: none !important;
}
.sr,
.choice input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.shell {
  width: min(1480px, calc(100% - clamp(28px, 6vw, 96px)));
  margin-inline: auto;
}
.mast {
  background: #151e20;
  border-bottom: 1px solid var(--hair);
}
.mast-inner,
.mast-tools,
.brand,
.languages,
.search,
.filter-row,
.choices,
.card-head,
.tags {
  display: flex;
  align-items: center;
}
.mast-inner {
  min-height: 56px;
  gap: 18px;
}
.brand {
  flex: none;
  gap: 9px;
}
.brand img {
  border: 1px solid #49594b;
  border-radius: 7px;
  background: #28352b;
}
.brand strong {
  font-size: 17px;
  letter-spacing: 0.04em;
}
.brand h1 {
  font-size: 16px;
  line-height: 1.2;
  font-weight: 650;
  border-left: 1px solid var(--line);
  padding-left: 9px;
}
.mast-tools {
  flex: none;
  gap: 12px;
}
#version {
  font: 12px var(--mono);
  color: var(--quiet);
}
.languages {
  gap: 2px;
  border-radius: 6px;
  border: 1px solid var(--line);
  padding: 2px;
}
.languages button,
.choice span {
  font-size: 12px;
  color: var(--dim);
  padding: 4px 9px;
  border-radius: 4px;
}
.languages [aria-pressed='true'],
.choice input:checked + span {
  background: #304638;
  color: #d6f4dd;
}
.languages button:hover,
.choice:hover span {
  color: var(--ink);
  background: #26372d;
}
.choice {
  position: relative;
  cursor: pointer;
}
.choice span {
  display: block;
  white-space: nowrap;
}
.choice input:focus-visible + span {
  outline: 2px solid var(--mint);
  outline-offset: 2px;
}
.search {
  flex: 1;
  min-width: 0;
  max-width: 400px;
  margin-left: auto;
  gap: 10px;
  background: var(--panel);
  border: 1px solid #46594d;
  border-radius: 7px;
  padding-inline: 12px;
  color: var(--quiet);
}
.search:focus-within {
  outline: 2px solid var(--mint);
  outline-offset: 1px;
}
.search input {
  background: none;
  border: 0;
  outline: none;
  min-width: 0;
  flex: 1;
  height: 36px;
  font-size: 13px;
}
.search input:focus-visible {
  outline: 0;
}
.search svg,
.search kbd {
  flex: none;
}
.search kbd {
  font: 11px var(--mono);
  padding: 2px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.filters {
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
}
.filter-row {
  gap: 9px;
  min-width: 0;
}
.filter-row + .filter-row {
  margin-top: 5px;
}
.filter-label {
  width: 42px;
  flex: none;
  font-size: 12px;
  color: var(--quiet);
}
.choices {
  flex-wrap: wrap;
  gap: 3px;
  min-width: 0;
}
.pool-row {
  align-items: flex-start;
}
.pool-row .filter-label {
  padding-top: 4px;
}
.results {
  margin-left: auto;
  color: var(--dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#effect-list {
  padding-bottom: 32px;
}
.group {
  --accent: #efa695;
  margin-top: 19px;
}
.group[data-category='defensive'] {
  --accent: #9ecfeb;
}
.group[data-category='utility'] {
  --accent: #d5cc95;
}
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  line-height: 1.4;
  margin-bottom: 9px;
}
.group-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--accent);
  border-radius: 2px;
}
.group-title small {
  font: 11px var(--mono);
  color: var(--quiet);
  font-weight: 400;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  gap: 10px;
}
.effect-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  scroll-margin-block: 18px;
}
.effect-card:target,
.effect-card.bookmark {
  border-color: var(--mint);
  background: #203029;
}
.card-head {
  gap: 9px;
}
.card-head img {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 3px;
  image-rendering: pixelated;
}
.card-head h3 {
  font-size: 14px;
  line-height: 1.35;
  font-weight: 650;
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.tier {
  font: 11px var(--mono);
  color: var(--accent);
}
.value {
  font-size: 13px;
  line-height: 1.5;
  margin: 9px 0 10px;
  overflow-wrap: anywhere;
}
.value b {
  color: #c6edd0;
  font-variant-numeric: tabular-nums;
}
.tags {
  gap: 3px 5px;
  flex-wrap: wrap;
  margin-top: auto;
}
.tag {
  font-size: 10px;
  color: var(--quiet);
  border: 1px solid var(--hair);
  border-radius: 4px;
  line-height: 1.4;
  padding: 1px 5px;
}
.tag.here {
  color: var(--tag-color);
  border-color: var(--tag-color);
}
.empty {
  text-align: center;
  padding: 46px 12px;
}
.empty h2 {
  font-size: 17px;
}
.empty p {
  color: var(--dim);
  margin-top: 7px;
}
@media (max-width: 760px) {
  .mast-inner {
    flex-wrap: wrap;
    gap: 9px 12px;
    padding-block: 10px;
  }
  .mast-tools {
    margin-left: auto;
  }
  .search {
    order: 1;
    flex-basis: 100%;
    max-width: none;
  }
}
@media (max-width: 600px) {
  .search kbd {
    display: none;
  }
  .filter-row {
    flex-wrap: wrap;
    gap: 5px;
  }
  .pool-row {
    flex-wrap: nowrap;
    gap: 5px;
  }
  .filter-label {
    width: 40px;
  }
  .choice span {
    padding: 4px 7px;
  }
  .results {
    font-size: 11px;
  }
  .group {
    margin-top: 16px;
  }
}
@media (max-width: 480px) {
  #version {
    display: none;
  }
  .brand {
    gap: 7px;
  }
  .brand strong {
    font-size: 16px;
  }
  .brand h1 {
    font-size: 14px;
    padding-left: 7px;
  }
}
@media print {
  .mast-tools,
  .filters,
  .search {
    display: none;
  }
  .shell {
    width: 100%;
  }
  .cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .effect-card {
    break-inside: avoid;
  }
}

    </style>
  </head>
  <body>
    <header class="mast">
      <div class="shell mast-inner">
        <div class="brand">
          <img id="brand-icon" width="32" height="32" alt="" /><strong>MCD2</strong>
          <h1 data-i18n="title">词条总览</h1>
        </div>
        <form class="search" role="search" id="search">
          <svg
            aria-hidden="true"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 4.5 4.5" /></svg
          ><label for="q" class="sr" data-i18n="search">搜索词条</label
          ><input type="search" id="q" autocomplete="off" spellcheck="false" /><kbd id="shortcut"
            >Ctrl K</kbd
          >
        </form>
        <div class="mast-tools">
          <span id="version"></span>
          <div class="languages" role="group" aria-label="语言 / Language">
            <button type="button" data-lang="zh" lang="zh-CN">中文</button
            ><button type="button" data-lang="en" lang="en">EN</button>
          </div>
        </div>
      </div>
    </header>
    <main class="shell">
      <div class="filters">
        <div class="filter-row">
          <span class="filter-label" id="rank-label" data-i18n="tier">阶数</span>
          <div id="ranks" class="choices" role="radiogroup" aria-labelledby="rank-label"></div>
          <span class="results" id="count" role="status"></span>
        </div>
        <div class="filter-row pool-row">
          <span class="filter-label" id="pool-label" data-i18n="scope">范围</span>
          <div id="pools" class="choices" role="radiogroup" aria-labelledby="pool-label"></div>
        </div>
      </div>
      <div id="effect-list"></div>
      <section class="empty" id="empty" hidden>
        <h2 data-i18n="empty">没有匹配的词条</h2>
        <p data-i18n="emptyHint">试试其他名称、效果，或将范围改为“全部”。</p>
      </section>
    </main>

    </script>
    <script>
      const $ = (id) => document.getElementById(id)
const data = JSON.parse($('glossary-data').textContent)
const categories = data.categories
const scopes = new Map(data.filters.map((p) => [p.id, p]))
const copy = {
  title: ['词条总览', 'Effect guide'],
  search: ['搜索词条', 'Search effects'],
  placeholder: ['搜索名称或效果', 'Search names or effects'],
  all: ['全部', 'All'],
  scope: ['范围', 'Scope'],
  tier: ['阶数', 'Tier'],
  offensive: ['攻击', 'Attack'],
  defensive: ['防御', 'Defense'],
  utility: ['实用', 'Utility'],
  other: ['其他', 'Other'],
  empty: ['没有匹配的词条', 'No matching effects'],
  emptyHint: [
    '试试其他名称、效果，或将范围改为“全部”。',
    'Try another search or set the scope to All.',
  ],
}
const norm = (s) => s.normalize('NFKC').toLowerCase()
const query = $('q')
let lang = 'zh',
  pool = '',
  rank = 'III'
const label = (key) => copy[key]?.[lang === 'zh' ? 0 : 1] || key
const name = (item) =>
  typeof item === 'string' ? item : item?.[lang] || item?.[lang === 'zh' ? 'en' : 'zh']
const categoryLabel = (category) => name(data.categoryLabels[category]) || label(category)
function el(tag, cls, text) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text !== undefined) node.textContent = text
  return node
}
function readRoute() {
  const hash = location.hash.slice(1),
    args = new URLSearchParams(hash)
  const legacy = hash.startsWith('sec-') ? hash.slice(4) : args.get('pool')
  const preset = legacy === 'Artifact' ? 'slot:artifact' : legacy
  lang = args.get('lang') === 'en' ? 'en' : 'zh'
  pool = scopes.has(preset) ? preset : ''
  rank = data.ranks.includes(args.get('tier')) ? args.get('tier') : 'III'
  query.value = args.get('q') || ''
  return args.get('effect')
}
function writeRoute() {
  const params = new URLSearchParams()
  if (lang === 'en') params.set('lang', lang)
  if (pool) params.set('pool', pool)
  if (rank !== 'III') params.set('tier', rank)
  if (query.value.trim()) params.set('q', query.value.trim())
  const hash = '#' + params
  if (hash !== (location.hash || '#')) history.replaceState(null, '', hash)
}
// Search both languages and IDs without exposing the alternate language or ID on cards.
const index = new Map(
  data.effects.map((e) => [
    e.id,
    new Map(
      e.tiers.map((tier) => [
        tier.rank,
        norm(
          [
            e.id,
            e.en,
            e.zh,
            tier.en,
            tier.zh,
            ...tier.slots.flatMap((slot) => [data.slots[slot].zh, data.slots[slot].en]),
          ].join(' '),
        ),
      ]),
    ),
  ]),
)
function choice(group, value, text) {
  const node = el('label', 'choice'),
    input = el('input')
  input.type = 'radio'
  input.name = group
  input.value = value
  node.append(input, el('span', '', text))
  return node
}
function controls() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
  document.title = label('title') + ' · MCD2'
  for (const node of document.querySelectorAll('[data-i18n]'))
    node.textContent = label(node.dataset.i18n)
  for (const b of document.querySelectorAll('[data-lang]'))
    b.setAttribute('aria-pressed', b.dataset.lang === lang)
  query.placeholder = label('placeholder')
  $('ranks').replaceChildren(...data.ranks.map((tier) => choice('tier', tier, tier)))
  $('pools').replaceChildren(
    choice('pool', '', label('all')),
    ...data.filters.map((p) => choice('pool', p.id, name(p))),
  )
}
function matchesScope(tier, scope) {
  return scope.slots
    ? tier.slots.some((slot) => scope.slots.includes(slot))
    : tier.pools.includes(scope.id)
}
function tagFor(tag) {
  const active = !pool || tag.filter === pool
  const node = el('span', 'tag' + (active ? ' here' : ''), name(tag))
  node.dataset.tag = tag.id
  if (active) node.style.setProperty('--tag-color', tag.color)
  return node
}
function cardFor(e) {
  const card = el('article', 'effect-card')
  card.dataset.effect = card.id = e.id
  const head = el('div', 'card-head')
  if (e.icon) {
    const image = el('img')
    image.src = e.icon
    image.alt = ''
    image.width = image.height = 34
    head.append(image)
  }
  const title = el('h3', '', name(e))
  title.id = 'name-' + e.id
  card.setAttribute('aria-labelledby', title.id)
  head.append(title, el('span', 'tier', e.tier.rank))
  const desc = el('p', 'value')
  for (const part of name(e.tier).split(/(-?\d+(?:[.,]\d+)?[%％]?)/))
    desc.append(/^-?\d/.test(part) ? el('b', '', part) : document.createTextNode(part))
  const tags = el('div', 'tags')
  tags.append(
    ...data.tags
      .filter((tag) => (tag.slot ? e.tier.slots.includes(tag.slot) : e.tier.pools.includes(tag.id)))
      .map(tagFor),
  )
  card.append(head, desc, tags)
  return card
}
function groupFor(type, entries) {
  const section = el('section', 'group')
  section.dataset.category = type
  const title = el('h2', 'group-title', categoryLabel(type))
  title.id = 'group-' + type
  title.append(el('small', '', String(entries.length)))
  section.setAttribute('aria-labelledby', title.id)
  const cards = el('div', 'cards')
  cards.append(...entries.map(cardFor))
  section.append(title, cards)
  return section
}
function render() {
  const words = norm(query.value.trim()).split(/\s+/).filter(Boolean)
  const available = data.effects.flatMap((effect) => {
    const tier = effect.tiers.find((t) => t.rank === rank)
    return tier ? [{ ...effect, tier }] : []
  })
  const matches = available.filter(
    (e) =>
      (!pool || matchesScope(e.tier, scopes.get(pool))) &&
      words.every((w) => index.get(e.id).get(rank).includes(w)),
  )
  for (const input of $('pools').querySelectorAll('input')) input.checked = input.value === pool
  for (const input of $('ranks').querySelectorAll('input')) input.checked = input.value === rank
  $('count').textContent =
    lang === 'zh'
      ? matches.length + ' / ' + available.length + ' 项'
      : matches.length + ' of ' + available.length + ' effects'
  $('empty').hidden = matches.length > 0
  $('effect-list').replaceChildren(
    ...categories.flatMap((type) => {
      const entries = matches.filter((e) => e.category === type)
      return entries.length ? [groupFor(type, entries)] : []
    }),
  )
}
function update() {
  render()
  writeRoute()
}
$('search').addEventListener('submit', (e) => e.preventDefault())
query.addEventListener('input', update)
$('pools').addEventListener('change', (e) => {
  pool = e.target.value
  update()
})
$('ranks').addEventListener('change', (e) => {
  rank = e.target.value
  update()
})
document.querySelector('.languages').addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]')
  if (b) {
    lang = b.dataset.lang
    controls()
    update()
  }
})
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault()
    query.focus()
    query.select()
  } else if (e.key === 'Escape' && document.activeElement === query && query.value) {
    e.preventDefault()
    query.value = ''
    update()
  }
})
function route() {
  const effect = readRoute()
  controls()
  render()
  const card = effect && document.getElementById(effect)
  if (card?.matches('.effect-card')) {
    card.classList.add('bookmark')
    requestAnimationFrame(() => card.scrollIntoView({ block: 'center' }))
  }
}
window.addEventListener('hashchange', route)
if (data.brand) {
  $('brand-icon').src = data.brand
  $('favicon').href = data.brand
} else $('brand-icon').hidden = true
$('version').textContent = 'v' + data.version
if (/Mac|iPad|iPhone/.test(navigator.platform)) $('shortcut').textContent = '⌘ K'
route()

    </script>
